<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Good Day For</title>
  <meta name="description" content="Reads the hour-by-hour forecast against each chore’s weather rules (stain the deck, paint, seal the driveway, mow, spray weeds, hang laundry) and shows you when to start.">
  <meta name="theme-color" content="#2d6a4f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141a17" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="#/">
      <img src="icon.svg" alt="" width="28" height="28">
      <span>Good Day For</span>
    </a>
    <button class="place-btn" id="placeBtn" type="button" aria-label="Change place">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
      <span>Pick a place</span>
    </button>
    <a class="gear" href="#/settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.7h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.7h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
    </a>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="foot">
    <p>Weather from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0). Forecasts change, and your product’s label has the final say.</p>
  </footer>
  <noscript><p class="noscript">Good Day For needs JavaScript to read the forecast.</p></noscript>
</body>
</html>
